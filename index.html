<style>
  :root{
    --green-950:#0f2620;
    --green-900:#16332c;
    --green-800:#204339;
    --sage-400:#8fb39c;
    --sage-200:#cfe0d5;
    --sand-100:#f1ecdd;
    --sand-50:#f8f5ec;
    --gold-500:#d9a441;
    --gold-600:#bd8a2e;
    --live-open:#4caf7d;
    --live-closed:#c1554b;
    --ink:#16241f;
    --radius-lg:28px;
    --radius-md:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--sand-50);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
    line-height:1.05;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,48px);}
  ::selection{background:var(--gold-500);color:var(--green-950);}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;scroll-behavior:auto !important;}
  }

  /* ---------- NAV ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(248,245,236,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(22,51,44,0.08);
  }
  nav.wrap{
    display:flex;align-items:center;justify-content:space-between;
    padding-top:16px;padding-bottom:16px;
  }
  .logo{
    display:flex;align-items:center;gap:10px;
    font-family:'Fraunces',serif;font-weight:700;font-size:1.15rem;color:var(--green-900);
  }
  .logo .cross{
    width:22px;height:22px;position:relative;flex:0 0 auto;
  }
  .logo .cross::before,.logo .cross::after{
    content:"";position:absolute;background:var(--gold-500);border-radius:2px;
  }
  .logo .cross::before{width:100%;height:34%;top:33%;left:0;}
  .logo .cross::after{height:100%;width:34%;left:33%;top:0;}
  nav ul{list-style:none;display:flex;gap:clamp(16px,2.5vw,32px);font-size:0.92rem;font-weight:500;}
  nav ul a{position:relative;padding:4px 0;color:var(--green-900);}
  nav ul a::after{
    content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--gold-500);
    transition:width 0.25s ease;
  }
  nav ul a:hover::after,nav ul a:focus-visible::after{width:100%;}
  .nav-cta{
    background:var(--green-900);color:var(--sand-50);padding:10px 20px;border-radius:999px;
    font-size:0.88rem;font-weight:600;white-space:nowrap;
    transition:background 0.2s ease, transform 0.2s ease;
  }
  .nav-cta:hover{background:var(--gold-600);transform:translateY(-1px);}
  .nav-links{display:flex;align-items:center;gap:clamp(16px,2.5vw,32px);}
  @media(max-width:760px){ nav ul{display:none;} }

  a:focus-visible, button:focus-visible{outline:2px solid var(--gold-600);outline-offset:3px;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    background:radial-gradient(circle at 15% 20%, var(--green-800), var(--green-950) 65%);
    color:var(--sand-50);
    padding:clamp(60px,10vw,110px) 0 clamp(70px,9vw,120px);
    overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size:26px 26px;
    opacity:0.5;
    animation:drift 40s linear infinite;
  }
  @keyframes drift{ from{background-position:0 0;} to{background-position:260px 260px;} }
  .hero-grid{
    position:relative;z-index:2;
    display:grid;grid-template-columns:1.15fr 0.85fr;gap:48px;align-items:center;
  }
  @media(max-width:900px){ .hero-grid{grid-template-columns:1fr;} }

  .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:0.78rem;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--sage-200);opacity:0.85;margin-bottom:18px;display:block;
  }
  .hero h1{font-size:clamp(2.4rem,5.2vw,4rem);color:#fff;}
  .hero h1 em{font-style:normal;color:var(--gold-500);}
  .hero p.lead{
    margin-top:22px;max-width:46ch;font-size:1.08rem;line-height:1.6;color:var(--sage-200);
  }
  .hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:14px 26px;border-radius:999px;font-weight:600;font-size:0.95rem;
    transition:transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    border:1px solid transparent;cursor:pointer;
  }
  .btn-primary{background:var(--gold-500);color:var(--green-950);}
  .btn-primary:hover{background:var(--gold-600);transform:translateY(-2px);box-shadow:0 10px 24px rgba(217,164,65,0.35);}
  .btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,0.35);}
  .btn-ghost:hover{border-color:#fff;transform:translateY(-2px);}

  /* live status capsule — signature element */
  .capsule-card{
    position:relative;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:var(--radius-lg);
    padding:30px 28px;
    backdrop-filter:blur(6px);
  }
  .capsule{
    display:flex;align-items:center;gap:14px;
    background:var(--sand-50);
    border-radius:999px;
    padding:10px 20px 10px 10px;
    width:fit-content;
  }
  .capsule .dot-wrap{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--green-950);
    position:relative;flex:0 0 auto;
  }
  .capsule .dot{
    width:12px;height:12px;border-radius:50%;
    background:var(--live-open);
  }
  .capsule.is-closed .dot{background:var(--live-closed);}
  .pulse{
    position:absolute;width:38px;height:38px;border-radius:50%;
    box-shadow:0 0 0 0 rgba(76,175,125,0.55);
    animation:pulse 2.2s ease-out infinite;
  }
  .capsule.is-closed .pulse{ box-shadow:0 0 0 0 rgba(193,85,75,0.5); }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(76,175,125,0.55); }
    70%{ box-shadow:0 0 0 14px rgba(76,175,125,0); }
    100%{ box-shadow:0 0 0 0 rgba(76,175,125,0); }
  }
  .capsule.is-closed{ }
  .capsule .status-text{color:var(--green-950);}
  .capsule .status-text .label{display:block;font-weight:700;font-size:1rem;}
  .capsule .status-text .sub{display:block;font-size:0.8rem;font-family:'JetBrains Mono',monospace;color:var(--green-800);opacity:0.75;margin-top:2px;}

  .capsule-card .clock{
    margin-top:22px;font-family:'JetBrains Mono',monospace;color:var(--sage-200);
    font-size:0.85rem;display:flex;justify-content:space-between;align-items:baseline;
  }
  .capsule-card .clock .time{font-size:1.6rem;color:#fff;font-weight:600;}
  .today-hours{margin-top:18px;padding-top:18px;border-top:1px dashed rgba(255,255,255,0.18);
    font-size:0.85rem;color:var(--sage-200);display:flex;justify-content:space-between;}

  /* ---------- SECTION SCAFFOLD ---------- */
  section{padding:clamp(64px,9vw,110px) 0;}
  .section-head{max-width:640px;margin-bottom:48px;}
  .section-head .eyebrow{color:var(--gold-600);}
  .section-head h2{font-size:clamp(1.8rem,3.4vw,2.6rem);color:var(--green-950);}
  .section-head p{margin-top:14px;color:#4b5c54;font-size:1.02rem;line-height:1.6;}

  .reveal{opacity:0;transform:translateY(28px);transition:opacity 0.7s ease, transform 0.7s ease;}
  .reveal.in{opacity:1;transform:translateY(0);}

  /* ---------- SERVICES ---------- */
  .services{background:var(--sand-100);}

<script>
document.getElementById('year').textContent = new Date().getFullYear();

// ---- Team data ----
const team = [
  ["Sonja Marquardt","PTA"],["Ljudmila Nowikoff","Apothekerin"],["Danny Müller","Apothekerin"],
  ["Andrea Terks","Apothekerin"],["Anke Wenner","PKA"],["Eveline Vogel","PKA"],
  ["Caroline Pawleta","Pharmaziestudentin"],["Petra Knopf","PTA"],["Irena Fray","PKA"],
  ["Max Wörister","Apotheker"],["Olga Kerber","PKA"],["Kai Schöhl","Bote"],["Simone Schuster","Apothekerin"]
];
const teamGrid = document.getElementById('teamGrid');
team.forEach(([name,role])=>{
  const initials = name.split(' ').map(p=>p[0]).join('').slice(0,2);
  const card = document.createElement('div');
  card.className = 'team-card reveal';
  card.innerHTML = `<div class="avatar">${initials}</div><h4>${name}</h4><p>${role}</p>`;
  teamGrid.appendChild(card);
});

// ---- Opening hours logic ----
// 0=So 1=Mo ... 6=Sa
const schedule = {
  1: [[8,0,13,0],[14,30,18,30]],
  2: [[8,0,13,0],[14,30,18,30]],
  3: [[8,0,13,0]],               // Mittwoch nachmittags geschlossen
  4: [[8,0,13,0],[14,30,18,30]],
  5: [[8,0,13,0],[14,30,18,30]],
  6: [[8,0,13,0]],               // Samstag nachmittags geschlossen
  0: []
};
const dayNames = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];

function fmt(h,m){ return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }

function rangesToText(ranges){
  if(!ranges.length) return "Geschlossen";
  return ranges.map(r=>`${fmt(r[0],r[1])}–${fmt(r[2],r[3])}`).join(' & ');
}

function buildHoursTable(){
  const table = document.getElementById('hoursTable');
  const now = new Date();
  table.innerHTML = '';
  for(let d=1; d<=7; d++){
    const day = d % 7; // 1..6,0
    const tr = document.createElement('tr');
    if(day === now.getDay()) tr.classList.add('today');
    tr.innerHTML = `<td>${dayNames[day]}</td><td>${rangesToText(schedule[day])}</td>`;
    table.appendChild(tr);
  }
}
buildHoursTable();

function minutesNow(now){ return now.getHours()*60 + now.getMinutes(); }

function computeStatus(now){
  const day = now.getDay();
  const ranges = schedule[day] || [];
  const nowMin = minutesNow(now) + now.getSeconds()/60;

  for(const [h1,m1,h2,m2] of ranges){
    const start = h1*60+m1, end = h2*60+m2;
    if(nowMin >= start && nowMin < end){
      return { open:true, changeAt: end, changeLabel: `Schließt um ${fmt(h2,m2)} Uhr` };
    }
  }
  // find next opening today
  for(const [h1,m1] of ranges){
    const start = h1*60+m1;
    if(nowMin < start){
      return { open:false, changeAt: start, changeLabel: `Öffnet um ${fmt(h1,m1)} Uhr` };
    }
  }
  // else next opening on a following day
  for(let i=1;i<=7;i++){
    const nd = (day+i)%7;
    const r = schedule[nd];
    if(r && r.length){
      const [h1,m1] = r[0];
      return { open:false, changeAt:null, changeLabel:`Öffnet ${dayNames[nd]} um ${fmt(h1,m1)} Uhr` };
    }
  }
  return { open:false, changeAt:null, changeLabel:"Öffnungszeiten siehe unten" };
}

function updateClock(){
  const now = new Date();
  document.getElementById('liveClock').textContent =
    now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});

  const status = computeStatus(now);
  const capsule = document.getElementById('statusCapsule');
  const label = document.getElementById('statusLabel');
  const sub = document.getElementById('statusSub');

  capsule.classList.toggle('is-closed', !status.open);
  label.textContent = status.open ? "Jetzt geöffnet" : "Aktuell geschlossen";
  sub.textContent = status.changeLabel;

  document.getElementById('todayHours').textContent = rangesToText(schedule[now.getDay()]);
}
updateClock();
setInterval(updateClock, 1000);

// ---- Scroll reveal ----
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
},{threshold:0.15});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
